<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fortius Rewards | CrossFit Fortius</title>
<meta name="description" content="Fortius Rewards, the member rewards program at CrossFit Fortius in San Diego, opens December 1.">
<style>
  :root{--navy:#11131a;--orange:#e09028;--blue:#0670bd;--page:#f3f2ee;--muted:#4e5560}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--page);color:var(--navy);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:32px 20px}
  main{width:100%;max-width:460px;text-align:center}
  .logo{display:block;width:240px;max-width:70%;height:auto;margin:0 auto 36px}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin:0 0 10px}
  h1{font-family:Jost,Arial,sans-serif;font-size:32px;line-height:1.08;text-transform:uppercase;margin:0 0 14px}
  p{font-size:17px;line-height:1.55;color:var(--muted);margin:0 0 28px}
  a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 30px;border-radius:999px;background:var(--blue);color:#fff;font-weight:700;font-size:16px;text-decoration:none}
  a.btn:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img class="logo" src="https://assets.cdn.filesafe.space/y9gcLsbGw7PjlF2HInjU/media/6adb6b60a0c3fa1f7d9689e4.png" alt="CrossFit Fortius" width="480" height="174">
  <p class="eyebrow">Fortius Rewards</p>
  <h1>Opens December 1.</h1>
  <p>This is where members will check their points. Until launch, the best thing you can do is show up and check in.</p>
  <a class="btn" href="https://www.crossfitfortius.com">Visit CrossFit Fortius</a>
</main>
</body>
</html>
