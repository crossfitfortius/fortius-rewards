(function () {
  "use strict";
  var W = 1920, H = 1080;
  var AREA = { x: 96, y: 196, w: 1728, h: 780 };
  var GAP = { sec: 40, col: 14, row: 12, head: 60, headGap: 18, pad: 30 };
  var MIN_FS = 24, MAX_FS = 46;
  var SECONDS = { board: 45, week: 15, summit: 12 };
  var stage = document.getElementById("stage");
  var reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  var data = EMBEDDED;
  var drift = [0, 0];
  var slides = [];
  var idx = 0;
  var timer = null;

  function fit() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / W, vh / H);
    var ox = (vw - W * s) / 2 + drift[0];
    var oy = (vh - H * s) / 2 + drift[1];
    var t = "translate(" + ox + "px," + oy + "px) scale(" + s + ")";
    stage.style.webkitTransform = t;
    stage.style.transform = t;
  }

  var ctx = document.createElement("canvas").getContext("2d");
  function nameEm(str) {
    ctx.font = "600 100px Montserrat, Arial, sans-serif";
    return ctx.measureText(str).width / 100 + 0.012 * str.length;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function isNew(since) {
    if (!since) return false;
    var t = Date.parse(since);
    return !isNaN(t) && (Date.now() - t) / 86400000 <= 14;
  }

  function norm(list) {
    var out = [];
    (list || []).forEach(function (n) {
      var name = typeof n === "string" ? n : n.name;
      var since = typeof n === "string" ? null : n.since;
      if (name) out.push({ name: name, isNew: isNew(since) });
    });
    out.sort(function (a, b) { return a.name.localeCompare(b.name); });
    return out;
  }

  function plan(sections) {
    var longest = nameEm("Aaron F.");
    sections.forEach(function (s) { s.names.forEach(function (n) { longest = Math.max(longest, nameEm(n.name)); }); });
    var best = null;
    for (var rows = 6; rows <= 18; rows++) {
      var cols = sections.map(function (s) { return Math.max(1, Math.ceil(s.names.length / rows)); });
      var C = 0, inner = 0;
      cols.forEach(function (c) { C += c; inner += (c - 1) * GAP.col; });
      var plateW = (AREA.w - GAP.sec * (sections.length - 1) - inner) / C;
      var plateH = (AREA.h - GAP.head - GAP.headGap - GAP.row * (rows - 1)) / rows;
      if (plateW <= 40 || plateH <= 20) continue;
      var fs = Math.min((plateW - GAP.pad) / longest, plateH * 0.5, MAX_FS);
      if (!best || fs > best.fs + 0.01) best = { rows: rows, cols: cols, plateW: plateW, plateH: plateH, fs: fs };
    }
    return best;
  }

  function splitSection(sec) {
    var parts = 1;
    while (parts < 30) {
      var p = plan([{ label: sec.label, names: sec.names.slice(0, Math.ceil(sec.names.length / parts)) }]);
      if (p && p.fs >= MIN_FS) break;
      parts++;
    }
    var size = Math.ceil(sec.names.length / parts);
    var out = [];
    for (var i = 0; i < parts; i++) {
      out.push({ label: parts > 1 ? sec.label + " (" + (i + 1) + "/" + parts + ")" : sec.label, names: sec.names.slice(i * size, (i + 1) * size) });
    }
    return out;
  }

  function boardPages(sections) {
    var all = plan(sections);
    if (all && all.fs >= MIN_FS) return [sections];
    var pages = [];
    var rest = sections.slice(1);
    splitSection(sections[0]).forEach(function (part) { pages.push([part]); });
    if (rest.length) {
      var p = plan(rest);
      if (p && p.fs >= MIN_FS) pages.push(rest);
      else rest.forEach(function (s) { splitSection(s).forEach(function (part) { pages.push([part]); }); });
    }
    return pages;
  }

  function frame() { return '<div class="frame-a"></div><div class="frame-b"></div>'; }

  function header() {
    return '<header class="b-head"><img class="logo" src="' + LOGO + '" alt="CrossFit Fortius">' +
      '<span class="rule-v" aria-hidden="true"></span><div class="titles"><h1>FORTIUS GRIT CLUB</h1>' +
      "<p>" + esc(data.tagline || "") + "</p></div></header>";
  }

  function footer() {
    var f = data.footer || {};
    return '<footer class="b-foot"><span>' + esc(f.left || "") + "</span><span>" + esc(f.right || "") + "</span></footer>";
  }

  function px(n) { return n.toFixed(2) + "px"; }

  function boardSlide(sections) {
    var p = plan(sections);
    var widths = sections.map(function (s, i) { return p.cols[i] * p.plateW + (p.cols[i] - 1) * GAP.col; });
    var total = widths.reduce(function (a, b) { return a + b; }, 0) + GAP.sec * (sections.length - 1);
    var x = (AREA.w - total) / 2;
    var html = frame() + header() + '<div class="sections" style="left:' + AREA.x + "px;top:" + AREA.y + "px;width:" + AREA.w + "px;height:" + AREA.h + 'px">';
    sections.forEach(function (s, i) {
      var cols = p.cols[i];
      var plates = "";
      for (var k = 0; k < cols * p.rows; k++) {
        var c = Math.floor(k / p.rows), r = k % p.rows;
        var pos = "left:" + px(c * (p.plateW + GAP.col)) + ";top:" + px(GAP.head + GAP.headGap + r * (p.plateH + GAP.row)) +
          ";width:" + px(p.plateW) + ";height:" + px(p.plateH) + ";font-size:" + px(p.fs);
        var n = s.names[k];
        plates += n
          ? '<div class="plate' + (n.isNew ? " new" : "") + '" style="' + pos + '">' + esc(n.name) + (n.isNew ? '<i class="tag-new">NEW</i>' : "") + "</div>"
          : '<div class="plate empty" aria-hidden="true" style="' + pos + '"></div>';
      }
      html += '<div class="sec" style="left:' + px(x) + ";width:" + px(widths[i]) + ";height:" + AREA.h + 'px"><div class="sec-head">' + esc(s.label) + "</div>" + plates + "</div>";
      x += widths[i] + GAP.sec;
    });
    html += "</div>" + footer();
    var el = document.createElement("section");
    el.className = "slide board";
    el.innerHTML = html;
    return el;
  }

  function summitSlide() {
    var s = data.summit || {};
    var names = norm(s.names);
    var mid = names.length
      ? '<div class="honor">' + names.map(function (n) { return '<div class="plate' + (n.isNew ? " new" : "") + '">' + esc(n.name) + "</div>"; }).join("") + "</div>"
      : '<p class="waiting">The first name goes here.</p>';
    var el = document.createElement("section");
    el.className = "slide summit";
    el.innerHTML = frame() + '<div class="feature"><img class="logo" src="' + LOGO + '" alt="CrossFit Fortius"><h2>SUMMIT</h2>' +
      '<div class="rule-h" aria-hidden="true"></div><p class="kicker">' + esc(s.points || "") + " lifetime points</p>" + mid +
      '<p class="perks">' + esc(s.perks || "") + "</p></div>" + footer();
    return el;
  }

  function weekSlide() {
    var list = (data.thisWeek || []).slice().sort(function (a, b) { return (b.classes || 0) - (a.classes || 0) || a.name.localeCompare(b.name); });
    var el = document.createElement("section");
    el.className = "slide week";
    el.innerHTML = frame() + '<div class="feature"><img class="logo" src="' + LOGO + '" alt="CrossFit Fortius"><h2>THIS WEEK</h2>' +
      '<div class="rule-h" aria-hidden="true"></div><p class="kicker">Milestones crossed in the last seven days</p><div class="honor">' +
      list.map(function (n) { return '<div class="plate tall">' + esc(n.name) + "<small>" + esc(String(n.classes)) + " CLASSES</small></div>"; }).join("") +
      "</div></div>" + footer();
    return el;
  }

  function summitOn(force) {
    var s = data.summit;
    if (!s) return false;
    if (force) return true;
    return !s.showFrom || Date.now() >= Date.parse(s.showFrom + "T00:00:00");
  }

  function frozen() { return /^#(board|summit|this-week)$/.test(location.hash); }

  function show(i) {
    if (!slides.length) return;
    idx = (i + slides.length) % slides.length;
    slides.forEach(function (s, k) {
      if (k === idx) s.el.className = s.el.className.replace(/\s*\bon\b/g, "") + " on";
      else s.el.className = s.el.className.replace(/\s*\bon\b/g, "");
    });
    clearTimeout(timer);
    if (!frozen() && slides.length > 1) timer = setTimeout(function () { show(idx + 1); }, slides[idx].secs * 1000);
  }

  function build() {
    var want = location.hash.replace("#", "");
    var sections = (data.sections || []).map(function (s) { return { label: s.label, names: norm(s.names) }; });
    slides = [];
    boardPages(sections).forEach(function (pg) { slides.push({ el: boardSlide(pg), secs: SECONDS.board, name: "board" }); });
    if ((data.thisWeek || []).length) slides.push({ el: weekSlide(), secs: SECONDS.week, name: "this-week" });
    if (summitOn(want === "summit")) slides.push({ el: summitSlide(), secs: SECONDS.summit, name: "summit" });
    stage.innerHTML = "";
    slides.forEach(function (s) { stage.appendChild(s.el); });
    var start = 0;
    slides.forEach(function (s, k) { if (s.name === want && start === 0) start = k; });
    show(start);
  }

  function refresh() {
    if (!window.fetch) return;
    window.fetch("board.json?ts=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (j && j.sections && JSON.stringify(j) !== JSON.stringify(data)) { data = j; build(); }
      })
      .catch(function () { /* keep showing what we have */ });
  }

  function start() {
    fit();
    build();
    document.documentElement.setAttribute("data-ready", "1");
    if (/^https?:$/.test(location.protocol)) { refresh(); setInterval(refresh, 20 * 60 * 1000); }
    if (/crossfitfortius\.com$/.test(location.hostname)) setTimeout(function () { location.reload(); }, 6 * 3600 * 1000);
    if (!reduce) {
      var offsets = [[0, 0], [4, 3], [-3, 4], [3, -4], [-4, -3]];
      var d = 0;
      setInterval(function () { d = (d + 1) % offsets.length; drift = offsets[d]; fit(); }, 180000);
    }
  }

  window.addEventListener("resize", fit);
  window.addEventListener("hashchange", build);
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === " " || e.keyCode === 39) show(idx + 1);
    if (e.key === "ArrowLeft" || e.keyCode === 37) show(idx - 1);
  });

  fit();
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load("600 40px Montserrat"), document.fonts.load("700 40px Cinzel")]).then(start, start);
  } else {
    setTimeout(start, 600);
  }
})();
</script>
